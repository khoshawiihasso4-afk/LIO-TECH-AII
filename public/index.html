<!DOCTYPE html>
<html lang="ku" dir="rtl" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08080a">
<title>LIO TECH Suite — Created by KHOSHAWII HASSO</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Kufi+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        colors: {
          brand: {
            red: '#ff4d4d',
            orange: '#ff9f43',
            blue: '#007aff',
            purple: '#5856d6',
            green: '#20bf6b',
            darkBg: '#08080a',
            darkCard: '#121216',
            darkBorder: '#22222a'
          }
        },
        fontFamily: {
          sans: ['"Plus Jakarta Sans"', '"Noto Kufi Arabic"', 'sans-serif']
        }
      }
    }
  }
</script>

<style>
:root {
  --bg-color: #f4f5f8;
  --card-bg: #ffffff;
  --card-border: #e2e4e9;
  --text-main: #0f172a;
  --text-muted: #64748b;
  --accent-red: #ff4d4d;
  --accent-blue: #007aff;
  --header-bg: rgba(255, 255, 255, 0.85);
}

.dark {
  --bg-color: #08080a;
  --card-bg: #121216;
  --card-border: #22222a;
  --text-main: #f8fafc;
  --text-muted: #94a3b8;
  --accent-red: #ff4d4d;
  --accent-blue: #38bdf8;
  --header-bg: rgba(18, 18, 22, 0.85);
}

body {
  background-color: var(--bg-color);
  color: var(--text-main);
  font-family: 'Plus Jakarta Sans', 'Noto Kufi Arabic', sans-serif;
  transition: background-color 0.3s ease, color 0.3s ease;
}

.glass-nav {
  background: var(--header-bg);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--card-border);
}

.gradient-btn-red {
  background: linear-gradient(135deg, #ff4d4d, #ff7676);
  box-shadow: 0 4px 20px rgba(255, 77, 77, 0.35);
}

.gradient-btn-blue {
  background: linear-gradient(135deg, #007aff, #5856d6);
  box-shadow: 0 4px 20px rgba(0, 122, 255, 0.35);
}

.gradient-btn-whatsapp {
  background: linear-gradient(135deg, #25D366, #128C7E);
  box-shadow: 0 4px 20px rgba(37, 211, 102, 0.35);
}

.markdown-body h1, .markdown-body h2, .markdown-body h3 {
  font-weight: 700;
  margin-top: 0.8rem;
  margin-bottom: 0.4rem;
}
.markdown-body h2 { font-size: 1.2rem; color: #ff4d4d; }
.markdown-body ul { list-style-type: disc; padding-inline-start: 1.2rem; margin: 0.4rem 0; }
.markdown-body ol { list-style-type: decimal; padding-inline-start: 1.2rem; margin: 0.4rem 0; }
.markdown-body strong { font-weight: 700; color: #10b981; }

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(140, 140, 140, 0.3); border-radius: 10px; }

.tab-content { display: none; }
.tab-content.active { display: block; animation: fadeIn 0.35s ease-in-out forwards; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body class="min-h-screen flex flex-col antialiased">

<header class="sticky top-0 z-50 glass-nav transition-colors">
  <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between gap-2">
    <div class="flex items-center gap-3 cursor-pointer" onclick="switchTab('kurdish-ai')">
      <div class="w-10 h-10 rounded-2xl flex items-center justify-center text-white font-black text-xl gradient-btn-red shadow-lg">L</div>
      <div>
        <div class="flex items-center gap-1.5">
          <span class="text-lg font-black tracking-tight">LIO <span class="text-red-500">TECH</span></span>
          <span class="text-[10px] px-2 py-0.5 rounded-full bg-red-500/10 text-red-500 font-extrabold border border-red-500/20">SUITE</span>
        </div>
        <p class="text-[10px] text-gray-500 dark:text-gray-400 font-medium">By KHOSHAWII HASSO</p>
      </div>
    </div>

    <nav class="hidden md:flex items-center gap-1 bg-gray-200/60 dark:bg-gray-800/60 p-1.5 rounded-2xl border border-[var(--card-border)] text-xs font-bold">
      <button onclick="switchTab('kurdish-ai')" id="tab-btn-kurdish-ai" class="nav-tab-btn px-4 py-2 rounded-xl transition-all flex items-center gap-2 text-gray-700 dark:text-gray-300 hover:text-red-500">
        <i class="fa-solid fa-robot"></i>
        <span>کوردستان AI</span>
      </button>
      <button onclick="switchTab('mobile-advisor')" id="tab-btn-mobile-advisor" class="nav-tab-btn px-4 py-2 rounded-xl transition-all flex items-center gap-2 text-gray-700 dark:text-gray-300 hover:text-blue-500">
        <i class="fa-solid fa-mobile-screen-button"></i>
        <span>ڕاوێژکاری مۆبایل</span>
      </button>
      <button onclick="switchTab('movies')" id="tab-btn-movies" class="nav-tab-btn px-4 py-2 rounded-xl transition-all flex items-center gap-2 text-gray-700 dark:text-gray-300 hover:text-amber-500">
        <i class="fa-solid fa-film"></i>
        <span>فیلمەکان</span>
      </button>
      <button onclick="switchTab('image-creator')" id="tab-btn-image-creator" class="nav-tab-btn px-4 py-2 rounded-xl transition-all flex items-center gap-2 text-gray-700 dark:text-gray-300 hover:text-purple-500">
        <i class="fa-solid fa-wand-magic-sparkles"></i>
        <span>دروستکردنی وێنە</span>
      </button>
    </nav>

    <div class="flex items-center gap-2">
      <button onclick="openWhatsAppModal()" class="px-3 py-2 text-xs font-bold text-white rounded-xl gradient-btn-whatsapp transition-all flex items-center gap-1.5 shadow-md">
        <i class="fa-brands fa-whatsapp text-sm"></i>
        <span class="hidden sm:inline">پشتیوانی WhatsApp</span>
      </button>
      <button onclick="toggleDarkMode()" class="w-9 h-9 rounded-xl border border-[var(--card-border)] bg-[var(--card-bg)] hover:bg-amber-500/10 hover:text-amber-500 transition-all flex items-center justify-center text-sm">
        <i id="themeIcon" class="fa-solid fa-moon"></i>
      </button>
    </div>
  </div>
</header>

<main class="flex-1 max-w-7xl w-full mx-auto px-4 py-6">

  <!-- TAB 1: KURDISH AI -->
  <section id="tab-kurdish-ai" class="tab-content active space-y-6">
    <div class="rounded-3xl p-6 sm:p-10 text-white shadow-2xl relative overflow-hidden bg-gradient-to-r from-red-600 via-rose-600 to-amber-600">
      <div class="relative z-10 max-w-3xl space-y-3">
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white/20 backdrop-blur-md text-xs font-extrabold">
          <i class="fa-solid fa-bolt text-amber-300"></i>
          <span>LIO TECH Kurdish AI • Powered by Gemini 3 Flash</span>
        </div>
        <h1 class="text-3xl sm:text-5xl font-black leading-tight">یاریدەدەری زیرەکی دەستکرد بە زمانی کوردی</h1>
        <p class="text-sm sm:text-base opacity-95 leading-relaxed font-medium">پرسیارەکەت بکە و وەڵامی دروست، خێرا و ڕێکخراو بە کوردیی سۆرانی وەربگرە. بەرهمهێنراوە لەلایەن KHOSHAWII HASSO.</p>
      </div>
    </div>

    <div class="p-5 sm:p-7 rounded-3xl border border-[var(--card-border)] bg-[var(--card-bg)] shadow-xl space-y-5">
      <div id="kurdishChatHistory" class="space-y-4 max-h-[500px] overflow-y-auto pr-1"></div>
      <div class="space-y-3 pt-2">
        <textarea id="kurdishInput" rows="3" class="w-full p-4 rounded-2xl border border-[var(--card-border)] bg-[var(--bg-color)] text-sm focus:outline-none focus:border-red-500 transition-all resize-none" placeholder="پرسیارەکەت لێرە بنووسە..."></textarea>
        <button id="sendKurdishBtn" onclick="sendKurdishMessage()" class="py-3 px-6 rounded-xl gradient-btn-red text-white font-extrabold text-sm flex items-center justify-center gap-2 cursor-pointer">
          <i class="fa-solid fa-paper-plane text-xs"></i>
          <span>ناردنی پرسیار</span>
        </button>
      </div>
    </div>
  </section>

  <!-- TAB 2: MOBILE ADVISOR -->
  <section id="tab-mobile-advisor" class="tab-content space-y-6">
    <div class="p-5 sm:p-7 rounded-3xl border border-[var(--card-border)] bg-[var(--card-bg)] shadow-xl space-y-5">
      <div id="mobileChatHistory" class="space-y-4 max-h-[450px] overflow-y-auto pr-1"></div>
      <div class="space-y-3 pt-2">
        <textarea id="mobileInput" rows="3" class="w-full p-4 rounded-2xl border border-[var(--card-border)] bg-[var(--bg-color)] text-sm focus:outline-none focus:border-blue-500 transition-all resize-none" placeholder="کێشەی مۆبایلەکەت یان بودجەکەت بنووسە..."></textarea>
        <button id="sendMobileBtn" onclick="sendMobileMessage()" class="py-3 px-6 rounded-xl gradient-btn-blue text-white font-extrabold text-sm flex items-center justify-center gap-2 cursor-pointer">
          <i class="fa-solid fa-robot"></i>
          <span>پرسیار لە پسپۆڕ بکە</span>
        </button>
      </div>
    </div>
  </section>

  <!-- TAB 3: MOVIES -->
  <section id="tab-movies" class="tab-content space-y-6">
    <div id="moviesGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4"></div>
  </section>

  <!-- TAB 4: IMAGE CREATOR -->
  <section id="tab-image-creator" class="tab-content space-y-6">
    <div class="p-6 rounded-3xl border border-[var(--card-border)] bg-[var(--card-bg)] shadow-xl space-y-4">
      <textarea id="imagePrompt" rows="4" class="w-full p-4 rounded-2xl border border-[var(--card-border)] bg-[var(--bg-color)] text-sm focus:outline-none focus:border-purple-500 transition-all resize-y" placeholder="وەسفی وێنەکە بنووسە..."></textarea>
      <div class="grid grid-cols-2 gap-3">
        <select id="imageRatio" class="p-3 rounded-xl border border-[var(--card-border)] bg-[var(--bg-color)] text-xs font-bold">
          <option value="1:1">1:1 Square</option>
          <option value="16:9">16:9 Landscape</option>
          <option value="9:16">9:16 Portrait</option>
        </select>
        <select id="imageStyle" class="p-3 rounded-xl border border-[var(--card-border)] bg-[var(--bg-color)] text-xs font-bold">
          <option value="photorealistic">Photorealistic</option>
          <option value="cinematic">Cinematic</option>
          <option value="anime">Anime</option>
        </select>
      </div>
      <button onclick="generateImage()" class="w-full py-4 rounded-2xl bg-gradient-to-r from-purple-600 to-pink-600 text-white font-black text-sm shadow-xl">
        ✨ دروستکردنی وێنە
      </button>
    </div>
    <div id="imageGallery" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4"></div>
  </section>

</main>

<footer class="pt-10 pb-8 text-center text-xs text-[var(--text-muted)] border-t border-[var(--card-border)] space-y-3 mt-10 bg-[var(--card-bg)]">
  <p>© 2026 KHOSHAWII HASSO. All rights reserved.</p>
</footer>

<script>
const WHATSAPP_PHONE = "9647507767066";
let kurdishChatHistory = [];
let mobileChatHistory = [];

window.addEventListener('DOMContentLoaded', () => {
  appendMessageUI("kurdishChatHistory", "ai", "سڵاو! من **LIO AI** م، یاریدەدەری زیرەکی تۆ بە سەرپەرشتی **KHOSHAWII HASSO**.", "LIO");
  appendMessageUI("mobileChatHistory", "ai", "سڵاو! من پسپۆڕی مۆبایل و تەکنەلۆژیام لە **LIO TECH**.", "MOB");
  loadMovies();
});

function switchTab(tabId) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  const target = document.getElementById(`tab-${tabId}`);
  if (target) target.classList.add('active');
}

function toggleDarkMode() {
  document.documentElement.classList.toggle("dark");
}

async function sendKurdishMessage() {
  const input = document.getElementById("kurdishInput");
  const text = input.value.trim();
  if (!text) return;

  input.value = "";
  appendMessageUI("kurdishChatHistory", "user", text);
  kurdishChatHistory.push({ role: 'user', parts: [{ text }] });

  try {
    const res = await fetch('/api/ai/text', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        systemInstruction: "You are LIO AI, Kurdish AI Assistant created by KHOSHAWII HASSO.",
        contents: kurdishChatHistory
      })
    });
    const data = await res.json();
    const reply = data?.candidates?.[0]?.content?.parts?.[0]?.text || "هەڵەیەک ڕوویدا";
    kurdishChatHistory.push({ role: 'model', parts: [{ text: reply }] });
    appendMessageUI("kurdishChatHistory", "ai", reply, "LIO");
  } catch (e) {
    appendMessageUI("kurdishChatHistory", "ai", "❌ هەڵە لە پەیوەندی سێرڤەر.", "LIO");
  }
}

async function sendMobileMessage() {
  const input = document.getElementById("mobileInput");
  const text = input.value.trim();
  if (!text) return;

  input.value = "";
  appendMessageUI("mobileChatHistory", "user", text);
  mobileChatHistory.push({ role: 'user', parts: [{ text }] });

  try {
    const res = await fetch('/api/ai/text', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        systemInstruction: "You are Mobile Diagnostic Specialist created by KHOSHAWII HASSO.",
        contents: mobileChatHistory
      })
    });
    const data = await res.json();
    const reply = data?.candidates?.[0]?.content?.parts?.[0]?.text || "هەڵەیەک ڕوویدا";
    mobileChatHistory.push({ role: 'model', parts: [{ text: reply }] });
    appendMessageUI("mobileChatHistory", "ai", reply, "MOB");
  } catch (e) {
    appendMessageUI("mobileChatHistory", "ai", "❌ هەڵە لە پەیوەندی سێرڤەر.", "MOB");
  }
}

async function loadMovies() {
  try {
    const res = await fetch('/api/tmdb/movie/popular');
    const data = await res.json();
    const grid = document.getElementById("moviesGrid");
    grid.innerHTML = (data.results || []).map(m => `
      <div class="bg-[var(--card-bg)] border border-[var(--card-border)] rounded-2xl overflow-hidden p-2">
        <img src="https://image.tmdb.org/t/p/w500${m.poster_path}" class="w-full aspect-[2/3] object-cover rounded-xl">
        <h4 class="font-bold text-xs truncate mt-2">${m.title}</h4>
      </div>
    `).join('');
  } catch (e) {}
}

async function generateImage() {
  const prompt = document.getElementById("imagePrompt").value.trim();
  const ratio = document.getElementById("imageRatio").value;
  const style = document.getElementById("imageStyle").value;

  if (!prompt) return;

  try {
    const res = await fetch('/api/ai/image', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt, ratio, style })
    });
    const data = await res.json();
    const inlineData = data?.candidates?.[0]?.content?.parts?.find(p => p.inlineData)?.inlineData;

    if (inlineData) {
      const imgUrl = `data:${inlineData.mimeType};base64,${inlineData.data}`;
      const gallery = document.getElementById("imageGallery");
      gallery.insertAdjacentHTML('afterbegin', `
        <div class="border border-[var(--card-border)] p-2 rounded-2xl bg-[var(--card-bg)]">
          <img src="${imgUrl}" class="w-full rounded-xl">
        </div>
      `);
    }
  } catch (e) {}
}

function appendMessageUI(containerId, role, text, avatarLabel = "LIO") {
  const container = document.getElementById(containerId);
  const isUser = role === "user";
  const div = document.createElement("div");
  div.className = `flex gap-2.5 ${isUser ? 'justify-end' : 'justify-start'}`;
  div.innerHTML = `<div class="p-3 rounded-2xl text-xs ${isUser ? 'bg-red-600 text-white' : 'bg-[var(--bg-color)] border border-[var(--card-border)]'}">${typeof marked !== 'undefined' ? marked.parse(text) : text}</div>`;
  container.appendChild(div);
}
</script>
</body>
</html>
